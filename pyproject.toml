[project]
name = "tokentriage"
version = "0.1.0"
description = "Per-request model routing for LangChain chat models (Anthropic, OpenAI, Gemini, Groq, DeepSeek, Mistral, xAI, Hugging Face), powered by lev from InterfazeAI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sathya" }]
keywords = ["llm", "routing", "langchain", "anthropic", "openai", "cost", "lev"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=1.0",
]

[project.optional-dependencies]
# lev is NOT an extra: it is not on PyPI, and PyPI rejects packages whose dependencies point
# at git URLs. Install it separately first (see README, "Prerequisite: lev").
http = ["httpx>=0.27"]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
gemini = ["langchain-google-genai>=3.0"]
groq = ["langchain-groq>=1.0"]
deepseek = ["langchain-deepseek>=1.0"]
mistral = ["langchain-mistralai>=1.0"]
xai = ["langchain-xai>=1.0"]
huggingface = ["langchain-huggingface>=1.0"]
openrouter = ["langchain-openrouter>=0.2"]
providers = ["tokentriage[anthropic,openai,gemini,groq,deepseek,mistral,xai,huggingface,openrouter]"]
yaml = ["pyyaml>=6"]
otel = ["opentelemetry-api>=1.20"]
all = ["tokentriage[http,providers,yaml,otel]"]
dev = ["tokentriage[providers]", "pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/sathyalog/tokentriage"
Repository = "https://github.com/sathyalog/tokentriage"
Issues = "https://github.com/sathyalog/tokentriage/issues"
"lev (decision model)" = "https://github.com/InterfazeAI/lev"

[project.scripts]
tokentriage = "tokentriage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Auto-discover packages from src-layout
# hatchling automatically finds src/tokentriage

[tool.hatch.build.targets.sdist]
include = ["src/tokentriage", "tests", "examples", "docs", "assets", "README.md", "LICENSE", "NOTICE", "CONTRIBUTING.md", "RELEASING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
